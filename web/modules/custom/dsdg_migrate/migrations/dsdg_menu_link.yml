id: dsdg_menu_link
label: 'Menu links (English)'
migration_tags:
  - dsdg
source:
  plugin: dsdg_menu_link
  # D7's "Navigation", "Sidebar", "User menu" and "Management" menus aren't
  # migrated: their custom links are stray pages, admin or login links.
  menus:
    main-menu: main
    menu-wet-footer: footer
  # The footer links are external, so they pair by hand (French => English).
  pairs:
    1997: 1858
    1998: 1859
    1999: 1860
    2000: 1861
  constants:
    bundle: menu_link_content
process:
  bundle: constants/bundle
  langcode:
    plugin: static_map
    source: language
    map:
      und: en
    bypass: true
  title: link_title
  description: description
  menu_name: dsdg_menu
  link/uri: dsdg_uri
  external: external
  weight: weight
  expanded: expanded
  enabled: enabled
  parent:
    plugin: menu_link_parent
    source:
      - dsdg_parent
      - '@menu_name'
      - parent_link_path
  changed: updated
destination:
  plugin: entity:menu_link_content
  no_stub: true
migration_dependencies:
  required:
    - dsdg_content_page
