id: dsdg_content_page_translation
label: 'Content pages (translations)'
migration_tags:
  - dsdg
source:
  # D7 translations are separate nodes linked by tnid. Each becomes a
  # translation of its source node, which dsdg_content_page kept at nid = tnid.
  plugin: d7_node
  node_type: content_page
  translations: true
process:
  # Some D7 sets have several French nodes; keep one (see the plugin).
  _keep:
    plugin: dsdg_skip_superseded_translation
    source: nid
  nid: tnid
  type:
    plugin: default_value
    default_value: content_page
  langcode: language
  content_translation_source:
    plugin: default_value
    default_value: en
  title: title
  uid:
    plugin: default_value
    default_value: 1
  status: status
  created: created
  changed: changed
  body/value:
    plugin: dsdg_body
    source: body/0/value
  body/summary: body/0/summary
  body/format:
    plugin: default_value
    default_value: full_html
  field_description/value: field_description/0/value
  field_description/format:
    plugin: default_value
    default_value: plain_text
  field_categories:
    plugin: sub_process
    source: field_categories
    process:
      target_id:
        plugin: migration_lookup
        migration: dsdg_category
        source: tid
        no_stub: true
  field_old_nid: nid
  path/pathauto:
    plugin: default_value
    default_value: 0
destination:
  plugin: entity:node
  translations: true
migration_dependencies:
  required:
    - dsdg_content_page
