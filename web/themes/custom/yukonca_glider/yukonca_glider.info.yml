name: Yukonca glider
type: theme
description: 'A Bootstrap-Tailwind-Powered theme based on Glider.'
core_version_requirement: ^11.3
# The theme's own interface translations, imported by drush locale:check and
# locale:update (and cron); translations customized in the UI take precedence.
'interface translation project': yukonca_glider
'interface translation server pattern': themes/custom/yukonca_glider/translations/%language.po
base theme: false
regions:
  header_branding: Header - Branding
  header_menu: Header - Menu
  language: language
  search: Search
  breadcrumb: 'Breadcrumb'
  pre_content: 'Pre content'
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  post_content: 'Post content'
  footer_logo: Footer - Logo
  footer_menu: Footer - Menu
  footer_legal: Footer - Legal notice

libraries:
  - yukonca_glider/bootstrap
  - yukonca_glider/global_styles
