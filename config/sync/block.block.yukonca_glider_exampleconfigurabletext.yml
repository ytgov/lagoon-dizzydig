  block_example_string: "  <p>The Digital Service Delivery Guide is a collection of best-practice guidance and processes for designing and delivering government services that are simple and fast and strive to improve the user experience.</p>\r\n\r\n<p>We've developed this advice to help project teams and vendors build consistent digital services and websites that work for citizens.</p>\r\n\r\n<div class=\"front__col__first\">\r\n\t<h3><a href=\"/en/content-design\">Content and design</a></h3>\r\n\r\n\t<ul>\r\n\t\t<li><a href=\"/en/content-and-design/brand-standards\">Brand standards</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/creating-content/data-visualization-and-presentation\">Data visualization and presentation</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/creating-content/how-get-online-service\">How to get an online service</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/forms\">Forms</a>&nbsp;(online and PDF)</li>\r\n\t\t<li><a href=\"/en/content-and-design/creating-content/email-newsletters-e-newsletters\">Email newsletters</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/government-yukon-style-guide\">Style Guide</a></li>\r\n\t</ul>\r\n\r\n\t<h3><a href=\"/en/technology\">Technology</a></h3>\r\n\r\n\t<ul>\r\n\t\t<li><a href=\"/en/technology/code-management-and-deployment\">Code management and deployment</a></li>\r\n\t\t<li><a href=\"/en/technology/service-compliance-checks-and-ux-assessments\">Service Compliance Checks and UX Assessments</a></li>\r\n\t\t<li><a href=\"/en/technology/technical-and-legal-assessments\">Technical and legal assessments</a></li>\r\n\t\t<li><a href=\"/en/technology/common-platform-components\">Common platform components</a></li>\r\n\t\t<li><a href=\"/en/technology/report-bug-or-request-improvement\">Report a bug or request an improvement</a></li>\r\n\t\t<li><a href=\"/en/technology/get-domain-name\">Get a domain name</a></li>\r\n\t</ul>\r\n</div>\r\n\r\n<div class=\"front__col__second\">\r\n\t<h3><a href=\"/en/project-management-and-procurement\">Project management and procurement</a></h3>\r\n\r\n\t<ul>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/digital-service-standards\">Digital service standards</a></li>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/information-vendors\">Information for vendors</a></li>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/information-vendors/get-account\">Get an account</a></li>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/information-government-staff/how-purchase-digital-tools-and\">Procurement</a></li>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/information-government-staff/how-purchase-digital-tools-and\">How to purchase digital tools and products</a></li>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/service-delivery-process\">Service delivery process</a></li>\r\n\t</ul>\r\n\r\n\t<h3>Most requested pages</h3>\r\n\r\n\t<ul>\r\n\t\t<li><a href=\"/en/content-and-design/user-experience-ux-guide\">User experience (UX) guide</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/exceptions-public-facing-digital-services-and-websites\">Exceptions for public-facing digital services and websites</a></li>\r\n\t\t<li><a href=\"/en/project-management-and-procurement/how-purchase-digital-tools-and-products/evaluate-digital-tools\">Evaluate digital tools and vendors through the procurement process</a></li>\r\n\t\t<li><a href=\"/en/technology/service-compliance-checks-and-ux-assessments\">Service Compliance Checks and UX Assessments</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/creating-content\">Creating content</a></li>\r\n\t\t<li><a href=\"/en/content-and-design/user-experience-ux-guide/ux-office-hours\">UX Office Hours</a></li>\r\n\t</ul>\r\n</div>\r\n"
