  label: 'Guide de prestation des services numériques'
  block_example_string: "\r\n<p>Le Guide de prestation des services numériques rassemble des conseils sur les meilleures pratiques les processus à employer pour concevoir et fournir des services gouvernementaux simples, rapides et conviviaux.</p>\r\n\r\n<p>Ce guide a été conçu pour aider les équipes de projet et les fournisseurs à créer des services numériques et des sites web uniformes, qui répondent aux besoins des citoyens.</p>\r\n\r\n<div class=\"front__col__first\">\r\n<h3><a href=\"/fr/contenu-et-design\">Contenu et design</a></h3>\r\n\r\n<ul>\r\n\t<li><a href=\"/fr/contenu-et-design/normes-de-marques\">Normes de marques</a></li>\r\n\t<li><a href=\"/fr/content-and-design/creating-content/presentation-et-visualisation-des-donnees\">Data visualization and presentation</a> (translation coming)</li>\r\n\t<li><a href=\"/fr/contenu-et-design/creation-de-contenu/obtenir-un-service-en-ligne\">Obtenir un service en ligne</a></li>\r\n\t<li><a href=\"/fr/contenu-et-design/formulaires\">Formulaires</a></li>\r\n\t<li><a href=\"/fr/contenu-et-design/guide-de-redaction-du-gouvernement-du-yukon\">Guide de rédaction</a></li>\r\n\t<li><a href=\"/fr/contenu-et-design/guide-de-lexperience-utilisateur\">User experience (UX) guide</a> (translation coming)</li>\r\n</ul>\r\n\r\n<h3><a href=\"/fr/technologie\">Technologie</a></h3>\r\n\r\n<ul>\r\n\t<li><a href=\"/fr/technologie/gestion-et-deploiement-des-codes\">Gestion et déploiement des codes</a></li>\r\n\t<li><a href=\"/fr/technologie/evaluations-de-la-maturite-du-service\">Évaluation de la maturité du service</a></li>\r\n\t<li><a href=\"/fr/technologie/evaluations-techniques-et-juridiques\">Évaluations techniques et juridiques</a></li>\r\n\t<li><a href=\"/fr/technologie/elements-de-la-plateforme-commune\">Éléments de la plateforme commune</a></li>\r\n\t<li><a href=\"/fr/technologie/signalement-des-bogues-ou-demande-damelioration\">Signalement des bogues ou demande d’amélioration</a></li>\r\n\t<li><a href=\"/fr/technologie/obtenir-un-nom-de-domaine\">Obtenir un nom de domaine</a></li>\r\n</ul>\r\n</div>\r\n\r\n<div class=\"front__col__second\">\r\n<h3><a href=\"/fr/gestion-de-projet-et-approvisionnement\">Gestion de projet et approvisionnement</a></h3>\r\n\r\n<ul>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/normes-des-services-numeriques\">Normes des services numériques</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/renseignements-pour-les-fournisseurs\">Renseignements pour les fournisseurs</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/obtention-dun-compte\">Obtention d’un compte</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/comment-faire-lacquisition-doutils-et-de-produits-numeriques\">Comment faire l’acquisition d’outils et de produits numériques</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/procedure-de-projet\">Procédure de projet</a></li>\r\n</ul>\r\n\r\n<h3>Pages les plus consultées</h3>\r\n\r\n<ul>\r\n\t<li><a href=\"/fr/contenu-et-design/guide-de-redaction-du-gouvernement-du-yukon\">Guide de rédaction</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/comment-faire-lacquisition-doutils-numeriques/evaluer-les\">Évaluer les outils numériques et les fournisseurs dans le cadre du processus d’approvisionnement</a></li>\r\n\t<li><a href=\"/fr/contenu-et-design/normes-de-marques/logo-du-gouvernement-du-yukon\">Logo du gouvernement du Yukon</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/procedure-de-projet/predecouverte-et-reception\">Prédécouverte et réception</a></li>\r\n\t<li><a href=\"/fr/contenu-et-design/creation-de-contenu\">Création de contenu</a></li>\r\n\t<li><a href=\"/fr/gestion-de-projet-et-approvisionnement/obtention-dun-compte/acces-au-reseau\">Accès au réseau</a></li>\r\n</ul>\r\n</div>\r\n"
